name: Database migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        # Only staging. The `production` GitHub Environment exists but has
        # never had a DATABASE_URL set, so choosing it failed at engine
        # construction with "Could not parse SQLAlchemy URL" - after the
        # operator had already decided to migrate production. Offering a
        # target that cannot work is worse than not offering it: the
        # deployed database this workflow actually migrates is staging's.
        description: GitHub Environment whose DATABASE_URL should be migrated
        required: true
        type: choice
        options:
          - staging

permissions:
  contents: read

concurrency:
  group: migrations-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked --no-dev
      - name: Apply Alembic migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run alembic upgrade head



