[project]
name = "edufurther-scholarship-finder"
version = "0.1.0"
description = "Edufurther Scholarship Finder backend"
requires-python = ">=3.14"
dependencies = [
    "parse-apis",
  "fastapi[standard]>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "PyJWT>=2.10,<3",
  "httpx>=0.28,<1",
  "email-validator>=2.2,<3",
  # zoneinfo has no bundled IANA database on Windows, and python:3.14-slim
  # (the deployment image) does not ship one as an OS package either -
  # without this, every known provider timezone silently resolves as if it
  # were unknown, with no error at all.
  "tzdata>=2024.1",
  "parse-sdk>=0.2.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest-cov>=6,<8",
  "mypy>=1.15,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.9,<1",
  "mypy>=1.15,<2",
  "bandit>=1.8,<2",
  "pip-audit>=2.7,<3",
  "sentry-sdk[fastapi]>=2.0,<3",
  "ruff>=0.9,<1",
]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".uv-cache", ".venv", "build", "dist"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
extend-ignore = ["B008", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One loop for the whole run: the application engine is cached per process, so
# a fresh loop per test leaves it holding connections bound to a closed loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = [".", "src"]

[tool.uv.sources]
parse-apis = { path = "parse_apis", editable = true }

# Managed by the parse CLI (`parse add` / `parse remove` / `parse sync`).
# Edit `apis` to curate which of your account APIs this repo syncs;
# an absent `apis` key means all of them.
[tool.parse]

