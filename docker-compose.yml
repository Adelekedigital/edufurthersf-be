services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scholarship_finder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scholarship_finder"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - scholarship_finder_pgdata:/var/lib/postgresql/data

volumes:
  scholarship_finder_pgdata:

